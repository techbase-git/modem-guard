# Modem hardware and recovery configuration.

# --- GPIO backend -------------------------------------------------------
# Where the modem control lines physically live:
#
#   expander  Lines on an I2C GPIO chip. Pins below are line offsets on that
#             chip, counted from zero - 0-7 for an MCP23008. The chip is
#             instantiated at boot by modem-gpio-init.service. This is the
#             default, because it is how most of the boards are built.
#   soc       CPU GPIO lines. Pins below are BCM numbers and nothing extra is
#             loaded. Boards without an expander must set this explicitly,
#             otherwise startup fails with a message about a missing I2C bus.
#
#             Do NOT use the global number from the old sysfs interface. If
#             that is all you have, subtract the chip's base: the base is the
#             number in the directory name under
#             /sys/bus/i2c/devices/<bus>-<addr>/gpio/gpiochip<BASE>,
#             so a global 584 on a chip based at 578 is offset 6.
MODEM_GPIO_BACKEND=expander

# Used only when MODEM_GPIO_BACKEND=expander. The defaults match the boards
# this supports, where the chip answers at 0x21 on bus 10.
MODEM_I2C_BUS=10
MODEM_I2C_ADDR=0x21
MODEM_I2C_CHIP=mcp23008

# How long to wait for the I2C bus and the gpiochip to appear [s]. At boot the
# unit starts before the bus is registered, and giving up immediately would
# leave it failed for good - systemd does not retry a oneshot.
MODEM_GPIO_WAIT=30

# --- GPIO lines ---------------------------------------------------------
# Both repair actions drive a GPIO line. Look both numbers up in your board
# documentation. With the soc backend these are BCM numbers, and SoC lines
# BANK0 = 0-27, BANK1 = 28-45, BANK2 = 46-53 are supported.

# With MODEM_GPIO_BACKEND=expander both lines can be left empty: on those
# boards they are always wired the same way, so the defaults below apply.
#   reset = offset 6
#   power = offset 7
# With the soc backend there is no such convention - the pins differ from
# board to board and have to be filled in, or the units refuse to run.

# SOFT RESET - the modem's own reset input. Pulsing it reboots the modem
# while power stays on.
MODEM_RESET_GPIO=
# Level that asserts reset. The line is left at the opposite level when the
# pulse ends - leaving it asserted would hold the modem down for good.
MODEM_RESET_ACTIVE=high
# How long the reset line is asserted [s]. Check the datasheet: the required
# pulse differs between modems, and if your board wires PWRKEY rather than
# RESET_N, too long a pulse powers the modem off instead of resetting it.
MODEM_RESET_PULSE=1

# HARD RESET - the line that controls modem power. Cutting it power cycles
# the modem completely.
MODEM_POWER_GPIO=
# Level at which the modem is powered.
MODEM_POWER_ACTIVE=high
# How long power stays off during a hard reset [s].
MODEM_POWER_OFF_TIME=1

# NOTE - the two lines need not share a polarity, and it differs between
# boards, so check both against your schematic. Getting the reset line
# backwards is the worst case: every reset then ends with the modem held
# down, and it stays down until the line is corrected by hand.

# --- Connectivity check -------------------------------------------------
# A modem can sit in state "connected" while no traffic passes, so being
# connected is not enough - modem-guard pings through the modem itself.
MODEM_PING_TARGET=8.8.8.8

# Optional second target, tried only if the first one fails. Useful because
# some M2M APNs block ICMP to certain hosts.
MODEM_PING_TARGET_2=1.1.1.1

# Network interface the ping is bound to. Leave empty to detect it from
# NetworkManager. Set it explicitly if detection picks the wrong device -
# an unbound ping would succeed over Ethernet and mask a dead modem.
MODEM_IFACE=

# How often the link is probed while it is healthy [s]. During a recovery
# round this is ignored and every tick probes, so the result of a reset is
# seen without delay.
MODEM_PING_INTERVAL=60

# How long a modem may sit in a transitional state - booting, searching,
# registering - before it counts as stuck [s]. These states are normal during
# startup, but a modem registered on the network with no data session looks
# exactly the same and is the most common real failure, so the patience has to
# end somewhere.
MODEM_STARTUP_GRACE=150

# --- Recovery timing ----------------------------------------------------
# Upper bound on how long the modem is given after each repair action before
# the next one is used. These are NOT fixed delays: health is checked on
# every tick, so a modem that recovers in 15 s is picked up right then.
#
# Set them to cover reset plus registration plus NetworkManager reconnect on
# your hardware. Too short and the hard reset fires while the modem is still
# coming back from the soft reset.
#
# Resolution is one timer tick (10 s by default, see
# /etc/systemd/system/modem-guard.timer). Lower the tick if you need to
# configure windows shorter than that.
MODEM_SETTLE_SOFT=30
MODEM_SETTLE_HARD=60

# Pause between failed recovery rounds is fixed at 1 min, then 5 min, then
# 15 min - see backoff_for() in /usr/sbin/modem-guard.

# --- Logging ------------------------------------------------------------
# How often to record one line saying what the modem is doing, even when
# nothing changed [s]. A healthy link produces no other output, so without
# this the journal stays empty and looks exactly like a supervisor that is
# not running. 0 turns it off.
MODEM_HEARTBEAT=600

# NO  = record only state changes and decisions (why a reset happened, when
#       connectivity returned). Keeps the journal readable at a 10 s tick.
# YES = additionally record every tick: the wake-up itself, the state file
#       contents, remaining windows and individual ping results.
#
# Takes effect on the next tick - no restart needed:
#   journalctl -u modem-guard.service -f
MODEM_DEBUG=NO
